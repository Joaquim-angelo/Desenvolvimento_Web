<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastro</title>
</head>
<body>

    <h2>Cadastro de Usuário</h2>

    <input type="text" id="nome" placeholder="Nome">
    <input type="email" id="email" placeholder="Email">
    <button onclick="cadastrar()">Cadastrar</button>

    <h3>Usuários cadastrados:</h3>
    <ul id="lista"></ul>

    <script>
        // Caso o site não esteja funcionando talvez o servidor não esteja ativado 
        // Para resolver isso tente o seguinte, vá ao terminal e digite: node servidor.js
        async function cadastrar() {
            const nome = document.getElementById("nome").value;
            const email = document.getElementById("email").value;

            //o fetch chama a função app.post no servidor.js
            await fetch("http://localhost:3000/usuarios", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ nome, email })
            });

            carregarUsuarios();
        }

        async function carregarUsuarios() {
            //aqui ele pede os dados do banco de dados
            const resposta = await fetch("http://localhost:3000/usuarios");
            const usuarios = await resposta.json();

            const lista = document.getElementById("lista");
            lista.innerHTML = "";

            usuarios.forEach(u => {
                const li = document.createElement("li");
                li.textContent = `${u.nome} - ${u.email}`;
                lista.appendChild(li);
            });
        }

        carregarUsuarios();
    </script>

</body>
</html>
